<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Basics | Contact</title>
    <meta name="description" content="Contact Cybersecurity Basics and submit questions using the website contact form.">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand">Cybersecurity Basics</a>
            <p class="tagline">Ask questions and share feedback.</p>
        </div>
    </header>

    <nav class="site-nav" aria-label="Main navigation">
        <div class="container nav-links">
            <a href="index.html">Home</a>
            <a href="threats.html">Threats</a>
            <a href="tips.html">Safety Tips</a>
            <a href="tools.html">Tools</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="container">
        <section class="page-banner">
            <p class="eyebrow">CONTACT</p>
            <h1>Send a question</h1>
        </section>

        <section class="form-card">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label for="topic">Topic</label>
                    <select id="topic" name="topic" required>
                        <option value="">Choose one</option>
                        <option value="passwords">Passwords</option>
                        <option value="phishing">Phishing</option>
                        <option value="malware">Malware</option>
                        <option value="general">General Question</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button class="button primary" type="submit">Submit Form</button>
                <p id="formMessage" class="success-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <div>
                <h3>Cybersecurity Basics</h3>
                <p>Contact page for questions and feedback.</p>
            </div>
            <div>
                <h3>Helpful Links</h3>
                <ul class="footer-list">
                    <li><a href="https://www.cisa.gov/" target="_blank" rel="noopener noreferrer">CISA</a></li>
                    <li><a href="https://consumer.ftc.gov/" target="_blank" rel="noopener noreferrer">FTC Consumer Advice</a></li>
                </ul>
            </div>
        </div>
        <p class="copyright">&copy; <span id="year"></span> Cybersecurity Basics</p>
    </footer>
</body>
</html>
